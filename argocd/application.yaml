apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: monapp
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/zakariastrong/monapp-gitops.git
    targetRevision: main
    path: apps/monapp
  destination:
    server: https://kubernetes.default.svc
    namespace: monapp
  syncPolicy:
    automated:
      selfHeal: true
      prune: true
    syncOptions:
      - CreateNamespace=true
